<button mat-icon-button [matMenuTriggerFor]="langMenu" [matTooltip]="languageStore.language() === 'en' ? 'English' : 'فارسی'">
  <span class="lang-badge">{{ languageStore.language() === 'en' ? 'EN' : 'FA' }}</span>
</button>
<mat-menu #langMenu="matMenu">
  @for (lang of languages; track lang.code) {
    <button mat-menu-item (click)="switchLanguage(lang.code)" [class.active-lang]="languageStore.language() === lang.code">
      <span class="lang-flag">{{ lang.flag }}</span>
      <span>{{ lang.label }}</span>
    </button>
  }
</mat-menu>
