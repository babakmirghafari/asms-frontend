<div class="page-header">
  <div class="page-header-text">
    <h1 class="page-header-title">{{ titleKey | translate }}</h1>
    @if (subtitleKey) {
      <p class="page-header-subtitle">{{ subtitleKey | translate }}</p>
    }
  </div>
  @if (showAdd) {
    <button mat-raised-button color="primary" (click)="addClicked.emit()">
      <mat-icon>add</mat-icon>
      {{ addLabelKey | translate }}
    </button>
  }
</div>
