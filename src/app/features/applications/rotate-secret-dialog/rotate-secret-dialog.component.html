<div class="rotate-dialog">
  <div mat-dialog-title class="dialog-title">
    <span>{{ 'APPLICATIONS.ROTATE_SECRET' | translate }} — {{ data.app.name }}</span>
    <button mat-icon-button (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    <div class="warning-box">
      <div class="warning-header">
        <mat-icon class="warning-icon">warning</mat-icon>
        <strong>{{ 'APPLICATIONS.ROTATION_WARNING' | translate }}</strong>
      </div>
      <p class="warning-body">{{ 'APPLICATIONS.ROTATION_WARNING_DETAIL' | translate }}</p>
    </div>

    <div class="checklist-label">{{ 'APPLICATIONS.PRE_ROTATION_CHECKLIST' | translate }}</div>

    <div class="checklist">
      <label class="checklist-item" (click)="toggle(0)">
        <mat-checkbox [checked]="checklist()[0]" (click)="$event.stopPropagation();" (change)="toggle(0)" color="primary" />
        <span>{{ 'APPLICATIONS.ROTATION_CHECK_1' | translate }}</span>
      </label>
      <label class="checklist-item" (click)="toggle(1)">
        <mat-checkbox [checked]="checklist()[1]" (click)="$event.stopPropagation();" (change)="toggle(1)" color="primary" />
        <span>{{ 'APPLICATIONS.ROTATION_CHECK_2' | translate }}</span>
      </label>
      <label class="checklist-item" (click)="toggle(2)">
        <mat-checkbox [checked]="checklist()[2]" (click)="$event.stopPropagation();" (change)="toggle(2)" color="primary" />
        <span>{{ 'APPLICATIONS.ROTATION_CHECK_3' | translate }}</span>
      </label>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-stroked-button (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
    <button mat-flat-button color="warn" [disabled]="!allChecked()" (click)="rotate()">
      {{ 'APPLICATIONS.ROTATE_NOW' | translate }}
    </button>
  </mat-dialog-actions>
</div>
