<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="ASMS - Advance Security Management">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M4 8 L24 4 L44 8 L44 24 C44 35 24 44 24 44 C24 44 4 35 4 24 Z"
        fill="url(#shieldGrad)" />

  <!-- Lock body (white) -->
  <rect x="17" y="23" width="14" height="11" rx="2" ry="2" fill="white" opacity="0.95"/>

  <!-- Lock shackle (white) -->
  <path d="M19 23 L19 19 C19 15.7 29 15.7 29 19 L29 23"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Lock keyhole -->
  <circle cx="24" cy="28" r="2" fill="#3F51B5"/>
  <rect x="23" y="28" width="2" height="3" fill="#3F51B5"/>

  <!-- Wordmark: ASMS -->
  <text x="54" y="22"
        font-family="Inter, Roboto, Helvetica Neue, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#1A237E"
        letter-spacing="1">ASMS</text>

  <!-- Subtitle -->
  <text x="55" y="36"
        font-family="Inter, Roboto, Helvetica Neue, sans-serif"
        font-size="10"
        font-weight="400"
        fill="#546E7A"
        letter-spacing="0.3">Advance Security Management</text>
</svg>
